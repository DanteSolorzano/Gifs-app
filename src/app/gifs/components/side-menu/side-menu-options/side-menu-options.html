<!-- bg-blue-800 -->

<div id="nav" class="w-full px-6">

        @for (item of menuOptions; track item.route){

            <a [routerLink]="item.route"
                routerLinkActive="bg-blue-800"
             class="w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3  hover:bg-white/5 transition ease-linear duration-150">
                <div>
                   <i [class]="item.icon"></i> 
                      
                </div>
                <div class="flex flex-col">
                    <span class="text-lg font-bold leading-5 text-white">{{ item.label }}</span>
                    <span class="text-sm text-white/50 hidden md:block">{{ item.sublabel }}</span>
                </div>
            </a>
        }  
        
        @for (key of gifService.searchHistoryKeys(); track key){
            
            <div class="flex items-center w-full border-b border-slate-700 transition ease-linear duration-150">
                
                <!-- Agregamos min-w-0 para permitir que el enlace se encoja si el texto es muy largo -->
                <a [routerLink]="['/dashboard/history', key]"
                routerLinkActive="bg-blue-800"
                class="flex-1 min-w-0 px-2 inline-flex space-x-2 items-center py-3 hover:bg-white/5 cursor-pointer">
                    
                    <!-- flex-shrink-0 evita que el icono del reloj se aplaste -->
                    <div class="flex-shrink-0">
                        <i class="fa-solid fa-clock-rotate-left"></i> 
                    </div>
                    
                    <!-- min-w-0 es obligatorio en flexbox para que truncate funcione -->
                    <div class="flex flex-col min-w-0 w-full">
                        <!-- truncate corta el texto extra y pone puntos suspensivos (...) -->
                        <span class="text-lg font-bold leading-5 text-white truncate">{{ key }}</span>
                    </div>
                </a>

                <!-- flex-shrink-0 asegura que el botón de borrar siempre mantenga su tamaño -->
                <button (click)="deleteHistoryItem(key)" 
                        class="flex-shrink-0 px-4 py-3 text-white/50 hover:text-red-500 hover:bg-white/5 transition-colors cursor-pointer">
                    <i class="fa-solid fa-trash"></i>
                </button>

            </div>
        }
</div>
